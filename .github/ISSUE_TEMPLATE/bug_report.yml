name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw response dumps do not.
        Replace them with `***`.

        A few things answer most reports faster than we can:

        - **Exit 3, `blocked_akamai`?** Akamai refused the client. In testing
          it served exactly one: the Scraping Browser with a US exit
          (`--cdp-endpoint`, `country-us`). Local Chromium was refused from a
          datacentre and from a US residential proxy alike. See the README's
          access table, and say in the report which client you used.
        - **Exit 5 on connect, HTTP 401?** A Scraping Browser profile's
          credentials expire (from about a day to over ten days, measured). Get a fresh endpoint.
        - **Exit 4, zero rows?** The listing may genuinely be empty. That is
          a correct answer. See
          [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md).
        - **A search full of unrelated products?** The site answers a query
          it cannot match with unrelated products rather than with nothing;
          the run warns, and the sidecar's `query_relevance` says how many
          rows mention the query.
        - **Prices differ from what you see on the site?** Prices are per
          store. The run prices at the stores near `--zip` (default 37027);
          your browser prices at the store it picked for you.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things: 3 is a
        refusal (Akamai), 4 is "ran fine, found nothing", 5 is "the
        data never arrived". The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --category poultry-feed-treats \
          --pages 3 --out poultry
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        144 products over 3 pages, as the site shows 272 in that category.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true
