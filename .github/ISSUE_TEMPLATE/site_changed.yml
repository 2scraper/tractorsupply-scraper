name: Site changed / API broke
description: tractorsupply.com changed its search endpoint or pages and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth
        its own report because the fix is different from a code bug:
        something on tractorsupply.com moved.

        Useful to know before filing: every row comes from ONE endpoint, the
        search the site's own listing page calls
        (`/gtwy/SiteSearch/catalogSearch`, newline-delimited JSON), and a
        category page is fetched only for its id. So a break is almost always
        a renamed field, a new required header or parameter, or a category id
        that moved in the page's `__NEXT_DATA__`.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - The run stops with "The endpoint refused this request (...)"
        - 0 rows on a query that visibly has results on the site
        - A specific column is null or wrong on every row
        - Every run is blocked by akamai, even through the Scraping Browser
        - Pagination stops early or repeats rows
        - "names no id the search endpoint filters on" for a real category
        - Something else
    validations:
      required: true

  - type: input
    id: query
    attributes:
      label: Mode and query
      description: The flags (or --url), and which client and exit you used.
      placeholder: "--category poultry-feed-treats --zip 37027 (Scraping Browser, country-us)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Whichever of these you can get. A capture beats a description.

        - The response as the parser saw it: re-run with
          `--dump-html response.ndjson` and paste the `catalog` record's
          first product (it is JSON).
        - For a column problem: the value you got, and the value the site shows.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
